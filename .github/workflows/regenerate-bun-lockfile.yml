name: Regenerate Bun Lockfile (member API fix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/explicit-member-create-api-route
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate lockfile
        run: bun install --lockfile-only

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock is already up to date"
            exit 0
          fi
          git commit -m "chore: regenerate bun lockfile for Firebase Admin 13"
          git push origin HEAD:fix/explicit-member-create-api-route
