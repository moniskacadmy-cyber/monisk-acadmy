name: Regenerate npm lockfile

on:
  push:
    branches:
      - fix/repair-owner-firestore-claims

permissions:
  contents: write

concurrency:
  group: regenerate-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/repair-owner-firestore-claims

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate lockfile with normal peer dependency resolution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile for compatible esbuild"
          git push origin HEAD:fix/repair-owner-firestore-claims
